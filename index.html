<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attention Is All You Need — Opus Vibe Generative Cinema (5:00)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+SC:wght@500;700;900&family=Noto+Serif+SC:wght@700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0908;
      color: #f4efe6;
      font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    #stage-wrap {
      position: relative;
      width: min(96vw, calc(82vh * 16 / 9));
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 30px 100px rgba(0,0,0,0.88), 0 0 0 1px rgba(244, 239, 230, 0.14);
      cursor: pointer;
    }
    canvas#c {
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      margin-top: 10px;
      width: min(96vw, calc(82vh * 16 / 9));
      background: rgba(18, 16, 14, 0.95);
      border: 1px solid rgba(244, 239, 230, 0.14);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(12px);
    }
    .hud-row {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }
    button.btn {
      background: rgba(244, 239, 230, 0.08);
      color: #f4efe6;
      border: 1px solid rgba(244, 239, 230, 0.22);
      border-radius: 6px;
      padding: 6px 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    button.btn:hover {
      background: rgba(234, 88, 12, 0.25);
      border-color: #ea580c;
      color: #fff;
    }
    button.btn-sound {
      background: linear-gradient(135deg, #ea580c, #d97706);
      color: #fff;
      border: none;
      box-shadow: 0 4px 16px rgba(234, 88, 12, 0.35);
    }
    button.chap {
      background: rgba(244, 239, 230, 0.05);
      color: #d6d0c4;
      border: 1px solid rgba(244, 239, 230, 0.14);
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    button.chap:hover, button.chap.active {
      background: rgba(217, 119, 6, 0.25);
      color: #fbbf24;
      border-color: #f59e0b;
    }
    #seek {
      flex: 1;
      accent-color: #ea580c;
      cursor: pointer;
      height: 6px;
    }
    #tc {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: #a8a29e;
      min-width: 245px;
      text-align: right;
    }
    #tc strong { color: #fbbf24; }
    body.clean #hud { display: none; }
  </style>
</head>
<body>
  <div id="stage-wrap" title="点击画面开启/关闭 钢琴颗粒度音效与配乐">
    <canvas id="c" width="1920" height="1080"></canvas>
  </div>

  <div id="hud">
    <div class="hud-row">
      <button class="btn" id="bPlay">⏸ 暂停</button>
      <button class="btn btn-sound" id="bSound">🎹 点击开启：钢琴颗粒音效 + 呼吸感配乐</button>
      <button class="btn" id="bPrev">-2s</button>
      <button class="btn" id="bNext">+2s</button>
      <input type="range" id="seek" min="0" max="300000" value="0" />
      <span id="tc"><strong>0:00.0</strong> / 5:00.0</span>
    </div>
    <div class="hud-row" id="chap-bar">
      <span style="font-size:11px;color:#a8a29e;font-family:monospace;">SCENES:</span>
      <button class="chap" data-t="0">① 0:00 穿入T字星核</button>
      <button class="chap" data-t="14">② 0:14 3D手稿与黑胶声波</button>
      <button class="chap" data-t="46">③ 0:46 记忆灰烬vs引力连线</button>
      <button class="chap" data-t="92">④ 1:32 3D晶格并行风暴</button>
      <button class="chap" data-t="126">⑤ 2:06 #1 Vaswani双核</button>
      <button class="chap" data-t="140">⑥ 2:20 #2 Shazeer 27亿回旋镖</button>
      <button class="chap" data-t="168">⑦ 2:48 #4 Uszkoreit 3D-RNA螺旋</button>
      <button class="chap" data-t="182">⑧ 3:02 #5 Jones 东京鱼群流体</button>
      <button class="chap" data-t="196">⑨ 3:16 #6 Gomez 实习生70亿超新星</button>
      <button class="chap" data-t="238">⑩ 3:58 万亿星系全貌与终章</button>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    const W = 1920, H = 1080, FPS = 30, BPM = 76;
    const BEAT = 60 / BPM, TAU = Math.PI * 2;
    const DUR = 300.0;

    const cv = document.getElementById("c");
    const ctx = cv.getContext("2d", { alpha: false });

    const SERIF = '"Playfair Display", "Noto Serif SC", Georgia, serif';
    const SANS  = '"Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';
    const MONO  = '"JetBrains Mono", Consolas, monospace';

    // Math & Physics Easing
    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const lerp = (a, b, u) => a + (b - a) * u;
    const prog = (t, a, b) => clamp((t - a) / Math.max(0.0001, b - a));
    const smooth = u => { const c = clamp(u); return c * c * (3 - 2 * c); };
    const eOut3 = u => 1 - Math.pow(1 - clamp(u), 3);
    const eOut4 = u => 1 - Math.pow(1 - clamp(u), 4);
    const eOutExpo = u => { const c = clamp(u); return c >= 1 ? 1 : 1 - Math.pow(2, -10 * c); };
    const eInOut3 = u => { const c = clamp(u); return c < 0.5 ? 4 * c * c * c : 1 - Math.pow(-2 * c + 2, 3) / 2; };
    const spring = (u, damp = 6.5, freq = 13.0) => {
      const c = clamp(u);
      if (c <= 0) return 0;
      if (c >= 1) return 1;
      return 1 - Math.exp(-damp * c) * Math.cos(freq * c);
    };
    const hash = (i, k = 0) => {
      const s = Math.sin(i * 127.1 + k * 311.7 + 19.19) * 43758.5453;
      return s - Math.floor(s);
    };
    const hexToRgb = h => [
      parseInt(h.slice(1, 3), 16),
      parseInt(h.slice(3, 5), 16),
      parseInt(h.slice(5, 7), 16)
    ];
    const rgba = (h, a) => {
      const [r, g, b] = hexToRgb(h);
      return `rgba(${r},${g},${b},${clamp(a)})`;
    };
    const mixHex = (h1, h2, u) => {
      const A = hexToRgb(h1), B = hexToRgb(h2), c = clamp(u);
      return `rgb(${Math.round(lerp(A[0], B[0], c))},${Math.round(lerp(A[1], B[1], c))},${Math.round(lerp(A[2], B[2], c))})`;
    };
    const bez2 = (p0, p1, p2, u) => {
      const v = 1 - u;
      return {
        x: v * v * p0.x + 2 * v * u * p1.x + u * u * p2.x,
        y: v * v * p0.y + 2 * v * u * p1.y + u * u * p2.y
      };
    };

    function rrect(x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function glowOrb(x, y, r, color, alpha = 1) {
      if (alpha <= 0.005 || r <= 0) return;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.8);
      g.addColorStop(0, rgba(color, alpha));
      g.addColorStop(0.28, rgba(color, alpha * 0.38));
      g.addColorStop(1, rgba(color, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r * 3.8, 0, TAU);
      ctx.fill();
    }

    // =========================================================================
    // ANTI-PPT PALETTE ENGINE (Rich Warm Obsidian, Archival Cream, Sunset Gold,
    // Emerald Aurora, Crimson Ember — NO FLAT BLUE SLIDES)
    // =========================================================================
    const PALETTES = {
      obsidianGold: { bg0: "#19130e", bg1: "#090705", grid: "#f59e0b", ink: "#faf5ec", sub: "#b8aba0", accent: "#fbbf24", accent2: "#ea580c", light: 0 },
      warmArchive:  { bg0: "#f5efe2", bg1: "#e4dac6", grid: "#9a8873", ink: "#181512", sub: "#5c5349", accent: "#c2410c", accent2: "#0f766e", light: 1 },
      amberStudio:  { bg0: "#1e1410", bg1: "#0c0806", grid: "#fb923c", ink: "#fff7ed", sub: "#d6bfb0", accent: "#f97316", accent2: "#f43f5e", light: 0 },
      crimsonVoid:  { bg0: "#1f1114", bg1: "#0b0607", grid: "#fb7185", ink: "#fff1f2", sub: "#cda8b0", accent: "#f43f5e", accent2: "#fbbf24", light: 0 },
      emeraldPulse: { bg0: "#0e1d18", bg1: "#050b09", grid: "#34d399", ink: "#ecfdf5", sub: "#99c2b5", accent: "#10b981", accent2: "#fbbf24", light: 0 },
      cosmosVelvet: { bg0: "#17131a", bg1: "#08060a", grid: "#eab308", ink: "#fefce8", sub: "#bdb3c4", accent: "#fbbf24", accent2: "#f43f5e", light: 0 }
    };

    function getPalette(t) {
      let a = PALETTES.obsidianGold, b = PALETTES.obsidianGold, u = 0;
      if (t < 14.0) { a = PALETTES.obsidianGold; b = PALETTES.warmArchive; u = smooth(prog(t, 12.8, 14.0)); }
      else if (t < 29.0) { a = PALETTES.warmArchive; b = PALETTES.amberStudio; u = smooth(prog(t, 27.8, 29.0)); }
      else if (t < 46.0) { a = PALETTES.amberStudio; b = PALETTES.crimsonVoid; u = smooth(prog(t, 44.8, 46.0)); }
      else if (t < 75.0) { a = PALETTES.crimsonVoid; b = PALETTES.emeraldPulse; u = smooth(prog(t, 73.8, 75.0)); }
      else if (t < 116.0) { a = PALETTES.emeraldPulse; b = PALETTES.warmArchive; u = smooth(prog(t, 114.8, 116.0)); }
      else if (t < 126.0) { a = PALETTES.warmArchive; b = PALETTES.cosmosVelvet; u = smooth(prog(t, 124.8, 126.0)); }
      else { a = PALETTES.cosmosVelvet; b = PALETTES.obsidianGold; u = smooth(prog(t, 237.0, 239.0)); }

      return {
        bg0: mixHex(a.bg0, b.bg0, u),
        bg1: mixHex(a.bg1, b.bg1, u),
        grid: mixHex(a.grid, b.grid, u),
        ink: mixHex(a.ink, b.ink, u),
        sub: mixHex(a.sub, b.sub, u),
        accent: mixHex(a.accent, b.accent, u),
        accent2: mixHex(a.accent2, b.accent2, u),
        light: lerp(a.light, b.light, u)
      };
    }

    // =========================================================================
    // KINETIC TYPOGRAPHY: WAVE-SPRING LETTERS & ODOMETER REELS (NO PPT TEXT!)
    // =========================================================================
    const POOL = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$+#*";

    function drawReelText(text, x, y, size, t, t0, opts = {}) {
      const fontFam = opts.serif ? SERIF : (opts.mono ? MONO : SANS);
      const weight = opts.weight || 800;
      const font = `${weight} ${size}px ${fontFam}`;
      const stag = opts.stag ?? 0.032;
      const dur = opts.dur ?? 0.48;
      const align = opts.align || "center";
      const color = opts.color || "#ffffff";
      const spin = opts.spin ?? 2;
      const track = opts.track ?? 0;

      ctx.save();
      ctx.font = font;
      ctx.textBaseline = "alphabetic";
      const chars = [...text];
      const widths = chars.map(ch => ctx.measureText(ch).width + track);
      const totalW = widths.reduce((a, b) => a + b, 0) - track;
      let curX = align === "center" ? x - totalW / 2 : (align === "right" ? x - totalW : x);

      if (opts.glow) {
        ctx.shadowColor = opts.glow;
        ctx.shadowBlur = opts.blur || 22;
      }

      const lh = size * 1.15;
      chars.forEach((ch, i) => {
        const w = widths[i];
        const p = prog(t, t0 + i * stag, t0 + i * stag + dur);
        if (p > 0 && ch !== " ") {
          if (p >= 1) {
            // Subtle living breathing wave even after landing!
            const waveY = opts.wave ? Math.sin(t * 3.2 + i * 0.45) * 3.5 : 0;
            ctx.fillStyle = color;
            ctx.fillText(ch, curX, y + waveY);
          } else {
            const sp = spring(p, 6.2, 13);
            const offset = (1 - sp) * lh * spin;
            ctx.save();
            ctx.beginPath();
            ctx.rect(curX - 8, y - size * 1.08, w + 16, lh * 1.25);
            ctx.clip();
            ctx.fillStyle = color;
            ctx.globalAlpha *= clamp(p * 2.5);
            ctx.fillText(ch, curX, y + offset);

            for (let k = 1; k <= spin; k++) {
              const glyph = POOL[Math.floor(hash(i * 19 + k, 7) * POOL.length)];
              ctx.globalAlpha = (0.42 - k * 0.12) * (1 - p);
              ctx.fillText(glyph, curX, y + offset - k * lh);
            }
            ctx.restore();
          }
        }
        curX += w;
      });
      ctx.restore();
      return totalW;
    }

    // Living Topographic & Constellation Field Background (Camera-Reactive!)
    function drawLivingField(t, pal, camX = 0, camY = 0, camZoom = 1) {
      const gx = W * 0.5 - clamp(camX * 0.15, -350, 350);
      const gy = H * 0.45 - clamp(camY * 0.15, -250, 250);
      const grad = ctx.createRadialGradient(gx, gy, 50, W * 0.5, H * 0.5, W * 0.85);
      grad.addColorStop(0, pal.bg0);
      grad.addColorStop(1, pal.bg1);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Flowing topographic contour waves + parallax star-dust
      ctx.save();
      const gridStep = 90;
      const ox = ((-camX * 0.35 + t * 18) % gridStep + gridStep) % gridStep;
      const oy = ((-camY * 0.35 + t * 12) % gridStep + gridStep) % gridStep;

      ctx.strokeStyle = pal.grid;
      ctx.globalAlpha = pal.light > 0.5 ? 0.12 : 0.07;
      ctx.lineWidth = 1;
      for (let x = ox - gridStep; x < W + gridStep; x += gridStep) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = oy - gridStep; y < H + gridStep; y += gridStep) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // 85 Parallax Constellation Particles that connect when close
      const pts = [];
      for (let i = 0; i < 85; i++) {
        const depth = 0.2 + 0.8 * hash(i, 1);
        const wx = hash(i, 2) * 3200 - 1600;
        const wy = hash(i, 3) * 2000 - 1000;
        const px = ((wx - camX * depth * 0.6 + t * 24 * depth) % W + W) % W;
        const py = ((wy - camY * depth * 0.6 - t * 14 * depth + Math.sin(t + i) * 18) % H + H) % H;
        const r = (1.1 + 2.8 * depth) * Math.sqrt(camZoom);

        ctx.fillStyle = i % 4 === 0 ? pal.accent : pal.grid;
        ctx.globalAlpha = (0.15 + 0.25 * Math.sin(t * 2.2 + i) ** 2) * depth;
        ctx.beginPath();
        ctx.arc(px, py, clamp(r, 0.8, 5), 0, TAU);
        ctx.fill();
        if (depth > 0.55) pts.push({ x: px, y: py });
      }

      ctx.strokeStyle = pal.grid;
      ctx.lineWidth = 0.8;
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
          if (d < 165) {
            ctx.globalAlpha = (1 - d / 165) * (pal.light > 0.5 ? 0.16 : 0.12);
            ctx.beginPath();
            ctx.moveTo(pts[i].x, pts[i].y);
            ctx.lineTo(pts[j].x, pts[j].y);
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    // Socratic Breathing Ring (No rectangular box — pure floating radial wave)
    function drawSocraticWave(t, t0, t1, zhText, enText, pal) {
      if (t < t0 || t > t1) return;
      const u = prog(t, t0, t1);
      const a = smooth(prog(t, t0, t0 + 0.45)) * (1 - smooth(prog(t, t1 - 0.45, t1)));
      ctx.save();
      ctx.globalAlpha = a;

      // Concentric breathing ripples
      for (let k = 0; k < 3; k++) {
        const rp = ((t * 0.65 + k / 3) % 1);
        ctx.strokeStyle = pal.accent;
        ctx.globalAlpha = a * (1 - rp) * 0.35;
        ctx.lineWidth = 2 * (1 - rp);
        ctx.beginPath();
        ctx.arc(W / 2, 135, 30 + rp * 110, 0, TAU);
        ctx.stroke();
      }

      ctx.globalAlpha = a;
      ctx.strokeStyle = pal.accent;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(W / 2, 135, 34, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - u));
      ctx.stroke();

      ctx.font = `800 12px ${MONO}`;
      ctx.fillStyle = pal.accent;
      ctx.textAlign = "center";
      ctx.fillText("PAUSE", W / 2, 139);

      if (zhText) {
        drawReelText(zhText, W / 2, 222, 46, t, t0 + 0.15, {
          color: pal.ink,
          glow: rgba(pal.accent, 0.35),
          wave: true
        });
      }
      if (enText) {
        drawReelText(enText, W / 2, 268, 22, t, t0 + 0.3, {
          color: pal.sub,
          mono: true
        });
      }
      ctx.restore();
    }

    // =========================================================================
    // SCENE 1 (0.0s – 14.0s): CAMERA DIVES THROUGH THE "T" PARTICLE ACCELERATOR
    // =========================================================================
    function drawScene1Accelerator(t, pal) {
      if (t >= 14.2) return;
      const out = 1 - smooth(prog(t, 13.0, 14.1));
      ctx.save();
      ctx.globalAlpha = out;

      // Camera physically zooms INTO the letter 'T' from 1.8s to 4.0s
      const zoomInT = eInOut3(prog(t, 1.6, 3.5));
      const camScale = lerp(1.0, 1.48, zoomInT);
      const cx = W / 2, cy = 440;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(camScale, camScale);
      ctx.translate(-cx, -cy);

      const glyphs = [
        { ch: "G", label: "GENERATIVE · 生成式", dx: -420 },
        { ch: "P", label: "PRE-TRAINED · 预训练", dx: 0 },
        { ch: "T", label: "TRANSFORMER · 变换器", dx: 420 }
      ];

      glyphs.forEach((g, i) => {
        const enter = spring(prog(t, i * 0.14, i * 0.14 + 0.65), 6.2, 13);
        const isT = i === 2;
        const x = isT ? lerp(cx + g.dx, cx, zoomInT) : lerp(cx + g.dx, cx + g.dx - 550 * zoomInT, zoomInT);
        const alpha = isT ? 1 : lerp(1, 0.0, clamp(zoomInT * 1.4));

        if (alpha > 0.01) {
          ctx.save();
          ctx.globalAlpha = out * alpha;
          ctx.translate(x, cy);
          ctx.scale(enter, enter);

          // Volumetric aura behind glyph
          glowOrb(0, -20, isT ? 140 : 85, isT ? "#f59e0b" : "#94a3b8", isT ? 0.35 : 0.14);

          ctx.font = `900 260px ${SERIF}`;
          ctx.textAlign = "center";
          ctx.fillStyle = isT ? "#fbbf24" : "#faf5ec";
          ctx.shadowColor = isT ? "#ea580c" : "transparent";
          ctx.shadowBlur = isT ? 45 : 0;
          ctx.fillText(g.ch, 0, 75);

          ctx.shadowBlur = 0;
          ctx.font = `700 20px ${MONO}`;
          ctx.fillStyle = isT ? "#fed7aa" : "#a8a096";
          ctx.fillText(g.label, 0, 145);
          ctx.restore();
        }
      });

      // At t >= 8.4s: Google 4-color particle accelerator spins around T and fires 8 golden comets!
      if (t >= 8.3) {
        const rev = spring(prog(t, 8.3, 9.2), 6.5, 13);
        const burst = eOut4(prog(t, 10.6, 13.5));
        const gCols = ["#4285F4", "#EA4335", "#FBBC05", "#34A853"];

        // 4-color spinning energy vortex
        for (let s = 0; s < 4; s++) {
          const a0 = t * 2.4 + s * (TAU / 4);
          ctx.save();
          ctx.strokeStyle = gCols[s];
          ctx.shadowColor = gCols[s];
          ctx.shadowBlur = 25;
          ctx.lineWidth = lerp(12, 3, burst) * rev;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(cx, cy, lerp(195, 290, burst) * rev, a0, a0 + 1.15);
          ctx.stroke();
          ctx.restore();
        }

        // 8 Golden Author Comets shooting outward in curved spiral trajectories
        if (burst > 0) {
          for (let k = 0; k < 8; k++) {
            const baseAng = (k / 8) * TAU - Math.PI / 2;
            for (let trail = 0; trail < 10; trail++) {
              const u = clamp(burst - trail * 0.025);
              if (u <= 0) continue;
              const rad = lerp(60, 740, eOut3(u));
              const ang = baseAng + u * 0.55;
              const px = cx + Math.cos(ang) * rad;
              const py = cy + Math.sin(ang) * rad * 0.72;
              ctx.fillStyle = trail === 0 ? "#ffffff" : "#fbbf24";
              ctx.globalAlpha = out * (1 - trail / 10) * 0.9;
              ctx.beginPath();
              ctx.arc(px, py, (7 - trail * 0.55), 0, TAU);
              ctx.fill();
            }
          }
        }

    function playPianoNote(midi, vol = 0.22, dur = 1.8) {
      if (!audioCtx || !soundOn) return;
      const now = audioCtx.currentTime;
      const freq = mtof(midi);

      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1450 + vol * 2800, now);
      filter.frequency.exponentialRampToValueAtTime(420, now + dur);
      filter.connect(audioCtx.destination);

      [1, 2, 3, 4].forEach((harm, idx) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = idx === 0 ? "triangle" : "sine";
        osc.frequency.setValueAtTime(freq * harm, now);
        osc.detune.setValueAtTime((idx % 2 === 0 ? 1 : -1) * 2.5, now);

        const peak = (vol / Math.pow(harm, 1.45)) * 0.5;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(peak, now + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur / (1 + idx * 0.4));

        osc.connect(g);
        g.connect(filter);
        osc.start(now);
        osc.stop(now + dur + 0.05);
      });
    }

      if (!audioCtx || !soundOn) return;

      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(pitch, now);
      osc.frequency.exponentialRampToValueAtTime(480, now + 0.028);

      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.035);
    }

      if (cueIdx !== -1 && cueIdx !== lastCueIdx) {
        lastCueIdx = cueIdx;
        const root = SCALE[cueIdx % SCALE.length];
        playPianoNote(root, 0.24, 2.2);
        setTimeout(() => playPianoNote(root + 7, 0.16, 2.4), 110);
      }

      if (cueIdx !== -1) {
        const cueStart = SUBS[cueIdx][0];
        if (t - cueStart < 0.65) {
          const slot = Math.floor(t * 18);
          if (slot !== lastTickSlot) {
            lastTickSlot = slot;
            playGranularTick(2100 + (slot % 5) * 240, 0.035);
          }
        }
      }

      const beatIdx = Math.floor(t / BEAT);
      if (beatIdx !== lastBeatIdx) {
        lastBeatIdx = beatIdx;
        if (isSocraticPause(t)) {
          if (beatIdx % 4 === 0) {
            playPianoNote(74, 0.15, 3.4);
            playPianoNote(62, 0.12, 3.6);
          }
        } else {
          const chordRoots = [50, 46, 53, 48];
          const barRoot = chordRoots[Math.floor(beatIdx / 4) % chordRoots.length];
          if (beatIdx % 4 === 0) {
            playPianoNote(barRoot, 0.25, 2.5);
            playPianoNote(barRoot + 12, 0.16, 1.9);
          } else if (beatIdx % 2 === 0) {
            playPianoNote(barRoot + 19, 0.14, 1.4);
          } else {
            playPianoNote(SCALE[(beatIdx * 2) % SCALE.length], 0.10, 1.1);
          }
        }
      }
    }

    // =========================================================================
    // INTERACTIVE PLAYER & SCENE CONTROLLER
    // =========================================================================
    const bPlay = document.getElementById("bPlay");
    const bSound = document.getElementById("bSound");
    const bPrev = document.getElementById("bPrev");
    const bNext = document.getElementById("bNext");
    const seek = document.getElementById("seek");
    const tc = document.getElementById("tc");
    const stageWrap = document.getElementById("stage-wrap");
    const chapBtns = Array.from(document.querySelectorAll(".chap"));

    let playing = true;
    let tNow = 0.0; // Open directly at the revamped 8 Authors Orbital Exodus so user can inspect immediately!
    let lastWall = performance.now();

    function fmtTime(s) {
      const m = Math.floor(s / 60);
      const r = (s % 60).toFixed(1).padStart(4, "0");
      return `${m}:${r}`;
    }

    function toggleSound() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      soundOn = !soundOn;
      bSound.textContent = soundOn
        ? "🔊 钢琴颗粒音效：已开启 (点击静音)"
        : "🎹 点击开启：钢琴颗粒音效 + 呼吸感配乐";
      if (soundOn) {
        playPianoNote(62, 0.24, 2.0);
        setTimeout(() => playPianoNote(69, 0.2, 2.2), 90);
      }
    }

    bSound.addEventListener("click", toggleSound);
    stageWrap.addEventListener("click", () => {
      if (!soundOn) toggleSound();
    });

    bPlay.addEventListener("click", () => {
      playing = !playing;
      bPlay.textContent = playing ? "⏸ 暂停" : "▶ 播放";
      lastWall = performance.now();
    });

    bPrev.addEventListener("click", () => {
      tNow = clamp(tNow - 2.0, 0, DUR);
      render(tNow);
    });

    bNext.addEventListener("click", () => {
      tNow = clamp(tNow + 2.0, 0, DUR);
      render(tNow);
    });

    seek.addEventListener("input", () => {
      tNow = clamp(Number(seek.value) / 1000, 0, DUR);
      render(tNow);
    });

    chapBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        tNow = clamp(Number(btn.dataset.t), 0, DUR);
        lastWall = performance.now();
        render(tNow);
      });
    });

    function loop(now) {
      const dt = (now - lastWall) / 1000;
      lastWall = now;
      if (playing) {
        tNow += dt;
        if (tNow >= DUR) tNow = 0;
        updateSoundtrack(tNow);
      }
      render(tNow);
      seek.value = Math.round(tNow * 1000);
      const pauseTag = isSocraticPause(tNow) ? " · 🧘 思考留白" : "";
      tc.innerHTML = `<strong>${fmtTime(tNow)}</strong> / ${fmtTime(DUR)}${pauseTag}`;

      let activeIdx = 0;
      chapBtns.forEach((btn, i) => {
        if (tNow >= Number(btn.dataset.t)) activeIdx = i;
      });
      chapBtns.forEach((btn, i) => btn.classList.toggle("active", i === activeIdx));

      requestAnimationFrame(loop);
    }

    render(tNow);
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
